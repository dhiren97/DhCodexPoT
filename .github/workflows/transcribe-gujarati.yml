name: Transcribe Gujarati audio

on:
  push:
    paths:
      - input/READY
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install speech recognition
        run: |
          python -m pip install --upgrade pip
          python -m pip install faster-whisper

      - name: Reconstruct and decode audio
        run: |
          cat input/audio.c2.b64.part* | base64 --decode > /tmp/audio.c2
          ffmpeg -hide_banner -loglevel error -f codec2 -i /tmp/audio.c2 -ac 1 -ar 16000 /tmp/audio.wav
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 /tmp/audio.wav

      - name: Transcribe Gujarati discourse
        env:
          WHISPER_MODEL: large-v3-turbo
        run: |
          mkdir -p output
          python transcribe.py /tmp/audio.wav output/transcript.json output/transcript.txt

      - name: Commit transcript
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/transcript.json output/transcript.txt
          git commit -m "Add Gujarati audio transcript" || exit 0
          git push
